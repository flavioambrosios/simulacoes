    <rect x="346" y="454" width="12" height="8"/><rect x="346" y="470" width="12" height="8"/><rect x="346" y="486" width="12" height="8"/><rect x="346" y="502" width="12" height="8"/>
    <rect x="516" y="502" width="12" height="8"/><rect x="516" y="486" width="12" height="8"/><rect x="516" y="470" width="12" height="8"/><rect x="516" y="454" width="12" height="8"/>
    <rect x="516" y="438" width="12" height="8"/><rect x="516" y="422" width="12" height="8"/><rect x="516" y="406" width="12" height="8"/><rect x="516" y="390" width="12" height="8"/>
  </g>
  <g class="small">
    <text x="330" y="398">1</text><text x="330" y="414">2</text><text x="330" y="430">3</text><text x="330" y="446">4</text>
    <text x="330" y="462">5</text><text x="330" y="478">6</text><text x="330" y="494">7</text><text x="330" y="510">8</text>
    <text x="535" y="510">9</text><text x="535" y="494">10</text><text x="535" y="478">11</text><text x="535" y="462">12</text>
