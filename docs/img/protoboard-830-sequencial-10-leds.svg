<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="leftHoles" width="250" height="16" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="8" r="3" fill="#b7b1a7"/><circle cx="67" cy="8" r="3" fill="#b7b1a7"/>
      <circle cx="112" cy="8" r="3" fill="#b7b1a7"/><circle cx="157" cy="8" r="3" fill="#b7b1a7"/>
      <circle cx="202" cy="8" r="3" fill="#b7b1a7"/>
    </pattern>
    <pattern id="rightHoles" width="250" height="16" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="8" r="3" fill="#b7b1a7"/><circle cx="67" cy="8" r="3" fill="#b7b1a7"/>
      <circle cx="112" cy="8" r="3" fill="#b7b1a7"/><circle cx="157" cy="8" r="3" fill="#b7b1a7"/>
      <circle cx="202" cy="8" r="3" fill="#b7b1a7"/>
    </pattern>
    <style>
      .title { fill: #104d63; font-size: 24px; font-weight: bold; }
      .heading { fill: #104d63; font-size: 17px; font-weight: bold; }
      .text { fill: #17212b; font-size: 13px; }
      .small { fill: #5b6875; font-size: 11px; }
      .board { fill: #fffdf7; stroke: #b9ad9b; stroke-width: 3; }
      .chip { fill: #2b2b2b; stroke: #111; stroke-width: 2; }
      .chiptext { fill: #fffdf7; font-size: 15px; font-weight: bold; }
      .pin { fill: #d9d4c9; stroke: #17212b; stroke-width: 1; }
      .vcc { fill: none; stroke: #c62828; stroke-width: 4; }
      .gnd { fill: none; stroke: #176b87; stroke-width: 4; }
      .signal { fill: none; stroke: #2e7d32; stroke-width: 3; }
      .rc { fill: none; stroke: #d9822b; stroke-width: 3; }
      .resistor { fill: #e9dcc0; stroke: #17212b; stroke-width: 1.5; }
      .led { fill: #5cc779; stroke: #17212b; stroke-width: 1.5; }
      .tag { fill: #104d63; stroke: #fff; stroke-width: 1; }
      .tagtext { fill: #fff; font-size: 11px; font-weight: bold; }
      .panel { fill: #eef6f7; stroke: #176b87; stroke-width: 2; }
    </style>
  </defs>

  <text x="800" y="34" text-anchor="middle" class="title">Mapa sugerido: sequencial de 10 LEDs em protoboard de 830 pontos</text>
  <text x="800" y="58" text-anchor="middle" class="small">Vista superior — alimentação regulada de 5V — confira a numeração impressa na sua protoboard</text>

  <!-- Breadboard body -->
  <rect x="55" y="82" width="840" height="1110" rx="18" class="board"/>

  <!-- Vertical power rails -->
  <line x1="90" y1="155" x2="90" y2="1163" class="vcc"/>
  <line x1="860" y1="155" x2="860" y2="1163" class="gnd"/>
  <text x="90" y="140" text-anchor="middle" class="text" fill="#c62828">+5V</text>
  <text x="860" y="140" text-anchor="middle" class="text" fill="#176b87">GND</text>

  <!-- Terminal strips, 63 rows -->
  <rect x="150" y="155" width="250" height="1008" fill="url(#leftHoles)"/>
  <rect x="500" y="155" width="250" height="1008" fill="url(#rightHoles)"/>
  <rect x="420" y="155" width="60" height="1008" fill="#f0ece4" stroke="#d7ccbb"/>
  <text x="180" y="148" class="small">a</text><text x="225" y="148" class="small">b</text><text x="270" y="148" class="small">c</text><text x="315" y="148" class="small">d</text><text x="360" y="148" class="small">e</text>
  <text x="520" y="148" class="small">f</text><text x="565" y="148" class="small">g</text><text x="610" y="148" class="small">h</text><text x="655" y="148" class="small">i</text><text x="700" y="148" class="small">j</text>
  <text x="450" y="690" text-anchor="middle" transform="rotate(-90 450 690)" class="small">canaleta central</text>

  <!-- Row number guides -->
  <g class="small" text-anchor="end">
    <text x="135" y="231">5</text><text x="135" y="311">10</text><text x="135" y="391">15</text>
    <text x="135" y="471">20</text><text x="135" y="551">25</text><text x="135" y="631">30</text>
    <text x="135" y="711">35</text><text x="135" y="791">40</text><text x="135" y="871">45</text>
    <text x="135" y="951">50</text><text x="135" y="1031">55</text><text x="135" y="1111">60</text>
  </g>

  <!-- NE555 at rows 6-9 -->
  <rect x="356" y="243" width="162" height="64" rx="8" class="chip"/>
  <path d="M419 243 A18 10 0 0 0 455 243" fill="#fffdf7"/>
  <text x="437" y="279" text-anchor="middle" class="chiptext">NE555</text>
  <g class="pin">
    <rect x="346" y="246" width="12" height="8"/><rect x="346" y="262" width="12" height="8"/><rect x="346" y="278" width="12" height="8"/><rect x="346" y="294" width="12" height="8"/>
    <rect x="516" y="294" width="12" height="8"/><rect x="516" y="278" width="12" height="8"/><rect x="516" y="262" width="12" height="8"/><rect x="516" y="246" width="12" height="8"/>
  </g>
  <text x="332" y="254" class="small">1</text><text x="332" y="270" class="small">2</text><text x="332" y="286" class="small">3</text><text x="332" y="302" class="small">4</text>
  <text x="535" y="302" class="small">5</text><text x="535" y="286" class="small">6</text><text x="535" y="270" class="small">7</text><text x="535" y="254" class="small">8</text>

  <!-- 555 power/control jumpers -->
  <path d="M352 250 H280 V180 H860" class="gnd"/><text x="290" y="243" class="small">p1</text>
  <path d="M352 298 H90" class="vcc"/><text x="275" y="304" class="small">p4</text>
  <path d="M522 250 H790 V195 H90" class="vcc"/><text x="548" y="244" class="small">p8</text>
  <path d="M352 266 H325 V282 H522" class="rc"/><text x="306" y="274" class="small">p2↔p6</text>

  <!-- RC components shown beside 555 -->
  <rect x="610" y="208" width="105" height="30" rx="5" class="resistor"/><text x="662" y="228" text-anchor="middle" class="small">R = 1kΩ</text>
  <path d="M522 266 H610 V223" class="rc"/><path d="M715 223 H790 V210 H90" class="vcc"/>
  <rect x="625" y="260" width="145" height="48" rx="6" fill="#fff4d7" stroke="#d9822b"/>
  <text x="697" y="280" text-anchor="middle" class="small">Potenciômetro 100kΩ</text>
  <text x="697" y="297" text-anchor="middle" class="small">lateral→p7 · centro→p6</text>
  <path d="M522 266 H600 V275 H625" class="rc"/><path d="M522 282 H600 V295 H625" class="rc"/>
  <line x1="585" y1="282" x2="585" y2="340" class="rc"/>
  <line x1="570" y1="340" x2="600" y2="340" stroke="#17212b" stroke-width="4"/>
  <path d="M570 354 Q585 345 600 354" fill="none" stroke="#17212b" stroke-width="4"/>
  <path d="M585 358 V385 H860" class="gnd"/>
  <text x="610" y="350" class="small">C 47/100µF</text>

