    <circle cx="320" cy="410" r="10" class="tag"/><text x="320" y="414" class="tagtext">2</text>
    <circle cx="320" cy="426" r="10" class="tag"/><text x="320" y="430" class="tagtext">1</text>
    <circle cx="320" cy="442" r="10" class="tag"/><text x="320" y="446" class="tagtext">3</text>
    <circle cx="320" cy="458" r="10" class="tag"/><text x="320" y="462" class="tagtext">7</text>
    <circle cx="320" cy="474" r="10" class="tag"/><text x="320" y="478" class="tagtext">8</text>
    <circle cx="320" cy="490" r="10" class="tag"/><text x="320" y="494" class="tagtext">4</text>
    <circle cx="580" cy="506" r="10" class="tag"/><text x="580" y="510" class="tagtext">9</text>
    <circle cx="580" cy="490" r="10" class="tag"/><text x="580" y="494" class="tagtext">5</text>
    <circle cx="580" cy="474" r="10" class="tag"/><text x="580" y="478" class="tagtext">10</text>
  </g>

  <!-- LED strip: source rows 24,28...60; LEDs on rows 26/27 etc. -->
  <g>
    <g transform="translate(0,0)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">1</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 1 · linhas 26/27</text></g>
    <g transform="translate(0,64)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">2</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 2 · linhas 30/31</text></g>
    <g transform="translate(0,128)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">3</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 3 · linhas 34/35</text></g>
    <g transform="translate(0,192)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">4</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 4 · linhas 38/39</text></g>
    <g transform="translate(0,256)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">5</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 5 · linhas 42/43</text></g>
    <g transform="translate(0,320)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">6</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 6 · linhas 46/47</text></g>
    <g transform="translate(0,384)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">7</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 7 · linhas 50/51</text></g>
    <g transform="translate(0,448)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">8</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 8 · linhas 54/55</text></g>
    <g transform="translate(0,512)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">9</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 9 · linhas 58/59</text></g>
    <g transform="translate(0,576)"><circle cx="565" cy="550" r="10" class="tag"/><text x="565" y="554" text-anchor="middle" class="tagtext">10</text><path d="M575 550 H620" class="signal"/><rect x="614" y="550" width="12" height="24" rx="3" class="resistor"/><path d="M620 574 V578" class="signal"/><circle cx="620" cy="590" r="12" class="led"/><text x="640" y="586" class="small">+</text><text x="640" y="607" class="small">−</text><path d="M620 602 V614 H860" class="gnd"/><text x="670" y="594" class="small">LED 10 · linhas 62/63</text></g>
  </g>

  <!-- Side instructions -->
  <rect x="940" y="90" width="610" height="1095" rx="10" class="panel"/>
  <text x="1245" y="125" text-anchor="middle" class="heading">Como usar este mapa</text>
  <text x="975" y="160" class="text">1. Coloque os dois CIs atravessando a canaleta:</text>
  <text x="995" y="183" class="text">• NE555 nas linhas 6 a 9.</text>
  <text x="995" y="206" class="text">• CD4017 nas linhas 15 a 22.</text>

  <text x="975" y="246" class="text">2. Faça primeiro as ligações de alimentação:</text>
  <text x="995" y="269" class="text">• vermelho = +5V;</text>
  <text x="995" y="292" class="text">• azul = GND.</text>

  <text x="975" y="332" class="text">3. Monte a rede RC do 555:</text>
  <text x="995" y="355" class="text">• pinos 2 e 6 unidos;</text>
  <text x="995" y="378" class="text">• capacitor entre pino 6 e GND;</text>
  <text x="995" y="401" class="text">• centro do potenciômetro no pino 6;</text>
  <text x="995" y="424" class="text">• um lateral no pino 7;</text>
  <text x="995" y="447" class="text">• resistor de 1kΩ entre pino 7 e +5V.</text>

  <text x="975" y="487" class="text">4. Una pino 3 do 555 ao pino 14 do 4017.</text>

  <text x="975" y="527" class="text">5. Nos círculos numerados:</text>
  <text x="995" y="550" class="text">• ligue 1 no 1, 2 no 2, ... 10 no 10;</text>
  <text x="995" y="573" class="text">• cada ligação é um jumper da saída do 4017</text>
  <text x="1012" y="596" class="text">até o resistor do LED correspondente.</text>

  <text x="975" y="636" class="text">6. Em cada LED:</text>
  <text x="995" y="659" class="text">• saída do 4017 → resistor de 1kΩ;</text>
  <text x="995" y="682" class="text">• resistor → perna longa do LED;</text>
  <text x="995" y="705" class="text">• perna curta do LED → GND.</text>

  <rect x="975" y="750" width="540" height="145" rx="6" fill="#fff4d7" stroke="#d9822b" stroke-width="2"/>
  <text x="1245" y="780" text-anchor="middle" class="heading" fill="#7a520b">Atenção</text>
  <text x="1000" y="812" class="text">• O pino 12 do 4017 fica vazio.</text>
  <text x="1000" y="837" class="text">• Os pinos 13 e 15 do 4017 vão ao GND.</text>
  <text x="1000" y="862" class="text">• Cada LED precisa do próprio resistor.</text>

  <text x="975" y="940" class="heading">Sobre as linhas indicadas</text>
  <text x="975" y="970" class="text">As linhas são uma sugestão para uma placa padrão de</text>
  <text x="975" y="993" class="text">830 pontos. Algumas marcas imprimem números ou dividem</text>
  <text x="975" y="1016" class="text">os trilhos de alimentação de forma diferente.</text>
  <text x="975" y="1056" class="text">Se precisar deslocar um componente, preserve as mesmas</text>
  <text x="975" y="1079" class="text">conexões elétricas descritas no guia.</text>

  <text x="975" y="1135" class="small">O desenho é um mapa didático de montagem, não uma fotografia em escala.</text>
</svg>