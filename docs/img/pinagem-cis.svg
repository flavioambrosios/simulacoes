<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .box { fill: #f4e9d8; stroke: #17212b; stroke-width: 2; }
    .title { font-weight: bold; font-size: 16px; fill: #104d63; }
    .note { font-size: 12px; fill: #5b6875; }
    .pin { font-size: 12px; fill: #17212b; }
    .pin1 { fill: #a53838; font-weight: bold; }
    .arrow { stroke: #176b87; stroke-width: 3; fill: none; marker-end: url(#arrowU); }
  </style>
  <defs>
    <marker id="arrowU" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#176b87"/></marker>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#104d63">Regra de ouro: como contar os pinos (visto de cima)</text>

  <!-- 555 DIP-8 -->
  <g transform="translate(60,60)">
    <text x="140" y="0" text-anchor="middle" class="title">CI 555 (8 pinos)</text>
    <rect x="40" y="20" width="200" height="260" rx="14" class="box"/>
    <path d="M110 20 A30 16 0 0 0 170 20 Z" fill="#fffdf7" stroke="#17212b" stroke-width="2"/>
    <text x="140" y="16" text-anchor="middle" class="note">entalhe (meia-lua)</text>

    <!-- left pins 1-4 top to bottom -->
    <circle cx="40" cy="55" r="6" fill="#a53838"/>
    <text x="20" y="59" text-anchor="end" class="pin pin1">1</text>
    <circle cx="40" cy="105" r="6" fill="#17212b"/>
    <text x="20" y="109" text-anchor="end" class="pin">2</text>
    <circle cx="40" cy="155" r="6" fill="#17212b"/>
    <text x="20" y="159" text-anchor="end" class="pin">3</text>
    <circle cx="40" cy="205" r="6" fill="#17212b"/>
    <text x="20" y="209" text-anchor="end" class="pin">4</text>

    <!-- right pins 5-8 bottom to top -->
    <circle cx="240" cy="205" r="6" fill="#17212b"/>
    <text x="260" y="209" class="pin">5</text>
    <circle cx="240" cy="155" r="6" fill="#17212b"/>
    <text x="260" y="159" class="pin">6</text>
    <circle cx="240" cy="105" r="6" fill="#17212b"/>
    <text x="260" y="109" class="pin">7</text>
    <circle cx="240" cy="55" r="6" fill="#17212b"/>
    <text x="260" y="59" class="pin">8</text>

    <path class="arrow" d="M40 55 V205"/>
    <path class="arrow" d="M40 205 Q140 250 240 205"/>
    <path class="arrow" d="M240 205 V55"/>
    <text x="140" y="315" text-anchor="middle" class="note">Pino 1 fica logo abaixo do entalhe. Contagem em "U": desce à esquerda, cruza embaixo, sobe à direita.</text>
  </g>

  <!-- 4017 DIP-16 -->
  <g transform="translate(500,60)">
    <text x="140" y="0" text-anchor="middle" class="title">CI 4017 (16 pinos)</text>
    <rect x="40" y="20" width="200" height="380" rx="14" class="box"/>
    <path d="M110 20 A30 16 0 0 0 170 20 Z" fill="#fffdf7" stroke="#17212b" stroke-width="2"/>
    <text x="140" y="16" text-anchor="middle" class="note">entalhe (meia-lua)</text>

    <!-- left pins 1-8 top to bottom -->
    <g font-size="12">
      <circle cx="40" cy="55" r="6" fill="#a53838"/><text x="20" y="59" text-anchor="end" class="pin pin1">1</text>
      <circle cx="40" cy="95" r="6" fill="#17212b"/><text x="20" y="99" text-anchor="end" class="pin">2</text>
      <circle cx="40" cy="135" r="6" fill="#17212b"/><text x="20" y="139" text-anchor="end" class="pin">3</text>
      <circle cx="40" cy="175" r="6" fill="#17212b"/><text x="20" y="179" text-anchor="end" class="pin">4</text>
      <circle cx="40" cy="215" r="6" fill="#17212b"/><text x="20" y="219" text-anchor="end" class="pin">5</text>
      <circle cx="40" cy="255" r="6" fill="#17212b"/><text x="20" y="259" text-anchor="end" class="pin">6</text>
      <circle cx="40" cy="295" r="6" fill="#17212b"/><text x="20" y="299" text-anchor="end" class="pin">7</text>
      <circle cx="40" cy="335" r="6" fill="#17212b"/><text x="20" y="339" text-anchor="end" class="pin">8</text>
    </g>

    <!-- right pins 9-16 bottom to top -->
    <g font-size="12">
      <circle cx="240" cy="335" r="6" fill="#17212b"/><text x="260" y="339" class="pin">9</text>
      <circle cx="240" cy="295" r="6" fill="#17212b"/><text x="260" y="299" class="pin">10</text>
      <circle cx="240" cy="255" r="6" fill="#17212b"/><text x="260" y="259" class="pin">11</text>
      <circle cx="240" cy="215" r="6" fill="#17212b"/><text x="260" y="219" class="pin">12</text>
      <circle cx="240" cy="175" r="6" fill="#17212b"/><text x="260" y="179" class="pin">13</text>
      <circle cx="240" cy="135" r="6" fill="#17212b"/><text x="260" y="139" class="pin">14</text>
      <circle cx="240" cy="95" r="6" fill="#17212b"/><text x="260" y="99" class="pin">15</text>
      <circle cx="240" cy="55" r="6" fill="#17212b"/><text x="260" y="59" class="pin">16</text>
    </g>

    <path class="arrow" d="M40 55 V335"/>
    <path class="arrow" d="M40 335 Q140 365 240 335"/>
    <path class="arrow" d="M240 335 V55"/>
    <text x="140" y="435" text-anchor="middle" class="note">Mesma regra: pino 1 abaixo do entalhe, contagem em "U" até o pino 16.</text>
  </g>

  <rect x="60" y="440" width="780" height="34" rx="4" fill="#eef6f7" stroke="#176b87"/>
  <text x="450" y="462" text-anchor="middle" class="pin" fill="#104d63">Dica: gire o chip sempre com o entalhe apontando para a mesma direção antes de contar os pinos.</text>
</svg>
